[package]
name = "tk-app"
description = "tatakai-next binary: wiring of tk-ui + tk-core + tk-ext + tk-link + tk-player - owner B6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["mpv", "live"]
mpv = ["tk-player/mpv"]
# `live` wires the real backend (src/live/*) over tk-core / tk-ext / tk-link; on by default.
live = ["dep:tk-core", "dep:tk-ext", "dep:tk-link", "dep:reqwest", "dep:time"]

[[bin]]
name = "tatakai-next"
path = "src/main.rs"

[dependencies]
tk-player = { workspace = true }
tk-ui = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# live backend
tk-core = { workspace = true, optional = true }
tk-ext = { workspace = true, optional = true }
tk-link = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
