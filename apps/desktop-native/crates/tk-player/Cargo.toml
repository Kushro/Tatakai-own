[package]
name = "tk-player"
description = "Embedded libmpv player (child HWND, Anime4K/FSR shader presets); NullPlayer without the mpv feature - owner B6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["mpv"]
# `mpv` links libmpv2. Without it the crate compiles with a NullPlayer so `cargo test` needs no libmpv.
mpv = ["dep:libmpv2"]

# Deliberately independent of tk-core: the app converts `tk_core::StreamSource` into `MediaSource`,
# so this crate builds and tests on its own.
[dependencies]
libmpv2 = { workspace = true, optional = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux embed target (tao default vbox) and the GL video surface; same gtk-rs 0.18 that tao 0.34 uses.
gtk = { workspace = true }
webkit2gtk = { workspace = true, features = ["v2_8"] }
libloading = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
