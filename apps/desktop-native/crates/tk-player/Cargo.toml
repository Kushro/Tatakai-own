[package]
name = "tk-player"
description = "Embedded libmpv player (child HWND, Anime4K/FSR shader presets); NullPlayer without the mpv feature - owner B6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Placeholder from B1. B6 (m3e/desktop-app) owns this crate.
[features]
default = ["mpv"]
# `mpv` links libmpv2. Without it the crate compiles with a NullPlayer so `cargo test` needs no libmpv.
mpv = ["dep:libmpv2"]

[dependencies]
tk-core = { workspace = true }
anyhow = { workspace = true }
libmpv2 = { workspace = true, optional = true }
raw-window-handle = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
