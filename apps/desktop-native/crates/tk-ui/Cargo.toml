[package]
name = "tk-ui"
description = "Dioxus 0.7 UI: router, shell, screens, components, i18n (en, es), tokens.css - owner B6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# tk-ui does not link tk-core / tk-ext / tk-link: it talks to the app through the `Backend` trait
# (view-model types in `backend.rs`), which tk-app implements over those crates. That keeps the UI
# crate compilable and testable on its own. assets/tokens.css is generated by packages/tokens (B1).
[dependencies]
tk-player = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
dioxus = { workspace = true }
qrcode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
