version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Contract: docs/redesign/10-wave3-torrents-contract.md section 2. tk-torrent knows nothing about tk-core / tk-ui:
