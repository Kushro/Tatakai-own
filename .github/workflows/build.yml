name: Build and Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        env:
          PATH: /bin:/usr/bin:/usr/local/bin:$PATH
        run: |
          # macOS runners on Node 22 can hit a race in esbuild's postinstall
          # (spawnSync Unknown system error -88). Retry with --ignore-scripts then
          # manually invoke esbuild's install.js so the binary is present for the build.
          if ! npm ci; then
            echo "::warning::npm ci failed � retrying with --ignore-scripts"
            npm ci --ignore-scripts
            node node_modules/esbuild/install.js || true
          fi

      - name: Test
        run: npm run test
        # Non-blocking: the unit suite carries pre-existing drift (stale import
        # paths after the desktop/runtime reorg, plus orphaned tests for modules
        # that were removed — permission-guard, logLevel, extensionAnalytics).
        # Keep it running and visible in CI, but don't gate the desktop build +
        # release on it. Tracked for a separate repair pass.
        continue-on-error: true

  # ──────────────────────────────────────────────────────
  #  Desktop — electron-builder with auto-update manifests
  #  Publishes latest.yml / latest-mac.yml / latest-linux.yml
  #  which electron-updater reads to detect new versions
  # ──────────────────────────────────────────────────────
  build-desktop:
    needs: [quality-gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        env:
          PATH: /bin:/usr/bin:/usr/local/bin:$PATH
        run: |
          # macOS runners on Node 22 can hit a race in esbuild's postinstall
          # (spawnSync Unknown system error -88). Retry with --ignore-scripts then
          # manually invoke esbuild's install.js so the binary is present for the build.
          if ! npm ci; then
            echo "::warning::npm ci failed � retrying with --ignore-scripts"
            npm ci --ignore-scripts
            node node_modules/esbuild/install.js || true
          fi

      # Vite inlines import.meta.env.VITE_* at BUILD time. With no .env present on
      # CI (it's gitignored), every VITE_* becomes '' in the bundle — and
      # src/integrations/supabase/client.ts then hits a missing anon key, which
      # black-screened the packaged renderer. The full client env lives in ONE repo
      # secret, DESKTOP_DOTENV, holding the .env file contents; Vite auto-loads
      # .env, so this reproduces a local `electron:build` 1:1. Passed via env: (not
      # inlined into the shell) so a value with special chars can't break the step.
      - name: Write build-time .env (client VITE_* vars)
        shell: bash
        env:
          DESKTOP_DOTENV: ${{ secrets.DESKTOP_DOTENV }}
          VITE_EXTENSION_API_URL: ${{ secrets.VITE_EXTENSION_API_URL }}
          VITE_EXTENSION_PORTAL_URL: ${{ secrets.VITE_EXTENSION_PORTAL_URL }}
        run: |
          if [ -n "$DESKTOP_DOTENV" ]; then
            printf '%s\n' "$DESKTOP_DOTENV" > .env
            echo "Wrote .env for the Vite build ($(grep -c . .env) non-empty lines)."
          else
            echo "::warning::DESKTOP_DOTENV secret is empty — VITE_* will be blank in this build; the packaged app will show a configuration-error screen instead of connecting to the backend."
          fi
          printf '\nVITE_EXTENSION_API_URL=%s\nVITE_EXTENSION_PORTAL_URL=%s\n' "$VITE_EXTENSION_API_URL" "$VITE_EXTENSION_PORTAL_URL" >> .env

      # ELECTRON_BUILD=true makes vite emit base:'./' so assets resolve under
      # file:// in the packaged app (without it, base is '/' and the packaged
      # renderer loads a blank page).
      - name: Build Vite app
        run: npx cross-env NODE_ENV=production ELECTRON_BUILD=true vite build
        env:
          # Headroom for the minify pass, which OOMs the default heap on large bundles.
          NODE_OPTIONS: --max-old-space-size=8192

      # Render the Tatakai-branded NSIS installer graphics (Windows installer UI)
      # from brand tokens with sharp (already a dep) → build/*.bmp. Referenced by
      # the nsis block in package.json; generated here so the binary BMPs stay out
      # of git and the installer art is reproducible. Harmless/unused on mac+linux.
      - name: Generate installer assets
        run: node scripts/generate-installer-assets.cjs

      # Bundle the per-platform `cloudflared` binary for host-hosted watch-party
      # tunnels. Downloaded here (not committed) so ~50MB binaries stay out of
      # git; electron-builder ships it via extraResources (from resources/bin).
      # Pinned version + SHA-256 check live in cloudflared-pin.cjs.
      - name: Download cloudflared (watch-party tunnel binary)
        shell: bash
        run: |
          set -e
          node scripts/fetch-cloudflared.cjs
          ls -la resources/bin

      # Tag push → publish to GitHub Release (creates latest.yml for electron-updater)
      # workflow_dispatch with publish → also publish
      # Otherwise → local build only
      - name: Build Electron
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid certificate: never auto-discover a macOS signing identity.
          # The bundle is still free ad-hoc signed through `identity: "-"`.
          # Replace it with Developer ID signing/notarization when secrets exist.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify macOS ad-hoc code signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -e
          for app in dist_electron/mac*/Tatakai.app; do
            echo "=== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature|Sealed Resources'
          done

      - name: Debug — list `dist_electron` contents
        shell: bash
        run: |
          echo "=== dist_electron contents ==="
          ls -la dist_electron || echo "dist_electron directory not found"

      - name: Validate desktop artifacts exist
        shell: bash
        run: |
          set -e
          matches=$(ls dist_electron/*.{exe,dmg,zip,AppImage,deb,yml,blockmap} 2>/dev/null || true)
          if [ -z "$matches" ]; then
            echo "No desktop artifacts were produced. Failing to surface the problem."
            ls -la dist_electron || true
            exit 1
          fi

      - name: Stage desktop files in the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-native-assets.mjs desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tatakai-${{ matrix.platform }}
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.yml
            dist_electron/*.blockmap
          if-no-files-found: warn
          retention-days: 30

  # ──────────────────────────────────────────────────────
  #  Android — Capacitor APK (self-signed developer build)
  # ──────────────────────────────────────────────────────
  build-android:
    needs: [quality-gates]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `android-actions/setup-android@v3` calls `sdkmanager tools` by default;
      # the `tools` package no longer exists in cmdline-tools 16.x, so it aborts
      # with `Failed to find package 'tools'`. Overriding `packages` skips it.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # That action only installs platform-tools — it never fetches a compile
      # platform, so a runner image without 36 fails later with
      # "Failed to find target with hash string 'android-36'". Pin the platform
      # this app compiles against (compileSdk 36) and its build tools explicitly.
      - name: Install Android platform + build tools
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      # The release build self-signs with the local Android debug keystore
      # (android/app/build.gradle). A clean CI runner has no ~/.android yet, so
      # generate the stock one with the alias + password the gradle file expects.
      # Cached between runs on purpose: Android refuses to install an update whose
      # signing key differs from the installed app's, so a fresh key per build
      # would turn every release into a reinstall rather than an update.
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: android-debug-keystore-

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | head -10

      - name: Install dependencies
        run: npm ci

      # Mobile builds must ship the WEB bundle (relative `/` base), not the
      # desktop one — ELECTRON_BUILD=true rewrites base to './', which is what
      # the packaged desktop app needs and would make the WebView assets resolve
      # relative to the page URL.
      - name: Write mobile build-time environment
        shell: bash
        env:
          DESKTOP_DOTENV: ${{ secrets.DESKTOP_DOTENV }}
          VITE_EXTENSION_API_URL: ${{ secrets.VITE_EXTENSION_API_URL }}
          VITE_EXTENSION_PORTAL_URL: ${{ secrets.VITE_EXTENSION_PORTAL_URL }}
        run: |
          if [ -n "$DESKTOP_DOTENV" ]; then
            printf '%s\n' "$DESKTOP_DOTENV" > .env
            echo "Wrote .env for the mobile build ($(grep -c . .env) non-empty lines)."
          else
            echo "::warning::DESKTOP_DOTENV is empty — VITE_* will be blank, so the mobile app will not connect to the backend."
          fi
          printf '\nVITE_EXTENSION_API_URL=%s\nVITE_EXTENSION_PORTAL_URL=%s\n' "$VITE_EXTENSION_API_URL" "$VITE_EXTENSION_PORTAL_URL" >> .env

      - name: Build web app
        run: npx cross-env NODE_ENV=production vite build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # `cap sync android` copies dist/ into android/app/src/main/assets/public
      # and writes android/capacitor.settings.gradle. Without it gradle builds
      # the stale checked-in WebView shell.
      - name: Sync Capacitor Android
        run: npx cap sync android
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build signed Android release
        run: cd android && chmod +x gradlew && ./gradlew assembleMobileRelease assembleTvRelease --no-daemon

      - name: Name Android artifact
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=$(find android/app/build/outputs/apk/mobile/release -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "Tatakai-v${VERSION}-android.apk"
          TV_APK=$(find android/app/build/outputs/apk/tv/release -name '*.apk' -print -quit)
          test -n "$TV_APK"
          cp "$TV_APK" "Tatakai-v${VERSION}-android-tv.apk"

      - name: Stage android files in the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-native-assets.mjs android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed Android artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tatakai-android
          path: Tatakai-*-android*.apk
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────
  #  iOS — unsigned .ipa archive (no Apple signing identity, same as macOS)
  # ──────────────────────────────────────────────────────
  build-ios-unsigned:
    needs: [quality-gates]
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write mobile build-time environment
        shell: bash
        env:
          DESKTOP_DOTENV: ${{ secrets.DESKTOP_DOTENV }}
          VITE_EXTENSION_API_URL: ${{ secrets.VITE_EXTENSION_API_URL }}
          VITE_EXTENSION_PORTAL_URL: ${{ secrets.VITE_EXTENSION_PORTAL_URL }}
        run: |
          if [ -n "$DESKTOP_DOTENV" ]; then
            printf '%s\n' "$DESKTOP_DOTENV" > .env
            echo "Wrote .env for the mobile build ($(grep -c . .env) non-empty lines)."
          else
            echo "::warning::DESKTOP_DOTENV is empty — VITE_* will be blank, so the mobile app will not connect to the backend."
          fi
          printf '\nVITE_EXTENSION_API_URL=%s\nVITE_EXTENSION_PORTAL_URL=%s\n' "$VITE_EXTENSION_API_URL" "$VITE_EXTENSION_PORTAL_URL" >> .env

      - name: Build web app
        run: npx cross-env NODE_ENV=production vite build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package unsigned IPA
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_PATH="ios/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p ios/package/Payload
          ditto "$APP_PATH" ios/package/Payload/Tatakai.app
          (cd ios/package && zip -qry "../../Tatakai-v${VERSION}-ios-unsigned.ipa" Payload)

      - name: Stage ios files in the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-native-assets.mjs ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned iOS artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tatakai-ios-unsigned
          path: Tatakai-*-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────
  #  Native PREVIEW (M0) — apps/android-native + apps/desktop-native
  #  New Kotlin/Compose and Rust/Dioxus apps; they install ALONGSIDE the
  #  legacy app (different applicationId / data dir). Assets are named
  #  Tatakai-Next-v<package.json version>-<platform>-preview.* so the
  #  legacy `Tatakai-v*` globs never touch them.
  # ──────────────────────────────────────────────────────
  build-android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      # compileSdk 37 (preview platform id is `android-37.0`). Try the minor-versioned
      # id first, then the plain one; fail with the installed list if neither exists.
      - name: Install Android platform + build tools
        shell: bash
        run: |
          set -e
          sdkmanager "build-tools;36.0.0"
          sdkmanager "platforms;android-37.0" || sdkmanager "platforms;android-37"
          sdkmanager --list_installed | grep -E 'platforms;android-37|build-tools;36.0.0'

      # Same stock debug keystore + cache key as the legacy `build-android` job, so
      # preview APKs of successive releases are updates of each other. (The legacy
      # and preview apps have different applicationIds, so sharing the key is safe.)
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: android-debug-keystore-

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # local.properties is gitignored; values come from repo secrets and are never echoed.
      - name: Write local.properties
        shell: bash
        env:
          TATAKAI_SUPABASE_URL: ${{ secrets.TATAKAI_SUPABASE_URL }}
          TATAKAI_SUPABASE_ANON_KEY: ${{ secrets.TATAKAI_SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$TATAKAI_SUPABASE_URL" ] || [ -z "$TATAKAI_SUPABASE_ANON_KEY" ]; then
            echo "::error::TATAKAI_SUPABASE_URL / TATAKAI_SUPABASE_ANON_KEY secrets are missing; the :app build would fail its checkTatakaiConfig task."
            exit 1
          fi
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'TATAKAI_SUPABASE_URL=%s\n' "$TATAKAI_SUPABASE_URL"
            printf 'TATAKAI_SUPABASE_ANON_KEY=%s\n' "$TATAKAI_SUPABASE_ANON_KEY"
          } > apps/android-native/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-native-${{ runner.os }}-${{ hashFiles('apps/android-native/**/*.gradle.kts', 'apps/android-native/gradle/**') }}
          restore-keys: gradle-native-${{ runner.os }}-

      - name: Unit tests
        working-directory: apps/android-native
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # The :app module defines no release buildType, so the default release is
      # unminified and UNSIGNED; it is signed below with apksigner.
      - name: Assemble release (unminified)
        working-directory: apps/android-native
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign and name the preview APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(find apps/android-native/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$SRC"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          OUT="Tatakai-Next-v${VERSION}-android-preview.apk"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --out "$OUT" "$SRC"
          "$APKSIGNER" verify --verbose "$OUT" | head -5
          ls -la "$OUT"

      - name: Stage native files in the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-native-assets.mjs native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload preview Android artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tatakai-next-android-preview
          path: Tatakai-Next-v*-android-preview.apk
          if-no-files-found: error
          retention-days: 30

  build-desktop-native:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust 1.94.1
        uses: dtolnay/rust-toolchain@ee868d7805ade43a1b47dd054727ab76c9108b4f # 1.94.1
        with:
          toolchain: 1.94.1
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop-native

      # Puts cl/link/lib/dumpbin on PATH (rquickjs + rusqlite compile C; fetch-deps
      # needs dumpbin + lib to make the libmpv import library).
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # SHA-256-pinned downloads only. `fonts` and `fsr` are skipped: their locks are
      # still unpinned (null hashes); JetBrains Mono ships in the repo.
      - name: Fetch runtime deps (libmpv, ffmpeg, Anime4K)
        run: ./apps/desktop-native/packaging/fetch-deps.ps1 -Only libmpv,ffmpeg,anime4k

      # No `dx` CLI needed: tk-ui embeds its CSS/i18n with include_str! and loads
      # fonts/shaders from next to the exe; there is no asset!() / manganis use.
      - name: Build tatakai-next (release)
        working-directory: apps/desktop-native
        env:
          TATAKAI_SUPABASE_URL: ${{ secrets.TATAKAI_SUPABASE_URL }}
          TATAKAI_SUPABASE_ANON_KEY: ${{ secrets.TATAKAI_SUPABASE_ANON_KEY }}
        run: |
          . ./packaging/deps/env.ps1
          Write-Host "RUSTFLAGS=$env:RUSTFLAGS"
          if (-not (Test-Path ./packaging/deps/libmpv/mpv.lib)) { throw 'mpv.lib was not generated (dumpbin/lib missing?)' }
          cargo build --release -p tk-app --locked

      - name: Package portable zip
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $app = "apps/desktop-native"
          $deps = "$app/packaging/deps"
          $stage = Join-Path $PWD "stage/Tatakai-Next"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$app/target/release/tatakai-next.exe" $stage
          Copy-Item "$deps/libmpv/libmpv-2.dll" $stage
          Copy-Item "$deps/ffmpeg" "$stage/ffmpeg" -Recurse
          New-Item -ItemType Directory -Force -Path "$stage/shaders" | Out-Null
          Copy-Item "$deps/shaders/*.glsl" "$stage/shaders"
          Copy-Item "$app/packaging/anime4k.lock.json" "$stage/shaders"
          New-Item -ItemType Directory -Force -Path "$stage/assets/fonts" | Out-Null
          Copy-Item "$app/crates/tk-ui/assets/fonts/*" "$stage/assets/fonts"
          Copy-Item "$app/LICENSE" $stage
          Copy-Item "$app/THIRD_PARTY_NOTICES.md" $stage
          $readme = @(
            "TATAKAI NEXT - VISTA PREVIA (M0)  v$version",
            "==========================================",
            "",
            "Esta es una vista previa de la nueva app nativa de escritorio (Rust + Dioxus + libmpv),",
            "hito M0. NO reemplaza a la app clasica de Tatakai (Electron): se instala y funciona",
            "en paralelo y no comparte datos con ella.",
            "",
            "Uso",
            "  1. Descomprime la carpeta completa donde quieras (es portable, no requiere instalador).",
            "  2. Ejecuta tatakai-next.exe. Requiere Windows 10/11 x64 con WebView2 (incluido en Windows 11).",
            "  3. Tus datos se guardan en %APPDATA%\Tatakai-Next\ (borra esa carpeta para empezar de cero).",
            "",
            "Limitaciones de la vista previa",
            "  - Funcionalidad parcial: puede haber errores y faltan funciones de la app clasica.",
            "  - Solo Windows x64. No esta firmada digitalmente: SmartScreen puede advertirte.",
            "  - Los shaders de reescalado FSR y las fuentes adicionales aun no se incluyen.",
            "",
            "Licencia: AGPL-3.0-or-later (ver LICENSE). Avisos de terceros: THIRD_PARTY_NOTICES.md.",
            "FFmpeg (LGPL-3.0-or-later) y libmpv (GPL-2.0-or-later) se distribuyen sin modificar."
          )
          Set-Content -Path "$stage/README-PREVIEW.txt" -Value $readme -Encoding utf8
          Compress-Archive -Path $stage -DestinationPath "Tatakai-Next-v$version-windows-x64-preview.zip" -CompressionLevel Optimal
          Get-Item "Tatakai-Next-v*-windows-x64-preview.zip" | Format-Table Name, Length

      # tatakai-next is a GUI-subsystem exe: run it through Start-Process so we wait
      # for it and capture stdout from a redirected file. --version exits before any
      # window, data dir or single-instance lock is created.
      - name: Smoke check
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'stage/Tatakai-Next'
          $exe = Join-Path $root 'tatakai-next.exe'
          if (-not (Test-Path $exe)) { throw 'tatakai-next.exe missing from the package' }
          foreach ($f in 'libmpv-2.dll', 'ffmpeg/bin/ffmpeg.exe', 'shaders/Anime4K_Restore_CNN_M.glsl', 'assets/fonts/JetBrainsMono.woff2', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'README-PREVIEW.txt') {
            if (-not (Test-Path (Join-Path $root $f))) { throw "package is missing $f" }
          }
          $out = Join-Path $env:RUNNER_TEMP 'tk-version.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $text = Get-Content $out -Raw
          Write-Host "exit=$($p.ExitCode) output=$text"
          if ($p.ExitCode -ne 0 -or $text -notmatch '^tatakai-next \d+\.\d+\.\d+') { throw '--version smoke check failed' }

      - name: Stage native files in the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-native-assets.mjs native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload preview Windows artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tatakai-next-windows-preview
          path: Tatakai-Next-v*-windows-x64-preview.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-desktop, build-android, build-ios-unsigned, build-android-native, build-desktop-native]
    runs-on: ubuntu-latest
    # Publish only after every platform has staged its complete assets.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-android.result == 'success' &&
      needs.build-desktop.result == 'success' &&
      needs.build-ios-unsigned.result == 'success' &&
      needs.build-android-native.result != 'cancelled' &&
      needs.build-desktop-native.result != 'cancelled'

    steps:
      - name: Checkout code (for AltStore source generator)
        uses: actions/checkout@v4

      - name: Collect staged native release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p desktop-artifacts/{windows,macos,linux} mobile-artifacts/{android,ios}
          gh release download "$GITHUB_REF_NAME" -D desktop-artifacts/windows -p '*win*.exe' -p '*win*.blockmap' -p 'latest.yml'
          gh release download "$GITHUB_REF_NAME" -D desktop-artifacts/macos -p '*mac*.dmg' -p '*mac*.zip' -p '*mac*.blockmap' -p 'latest-mac.yml'
          gh release download "$GITHUB_REF_NAME" -D desktop-artifacts/linux -p '*.AppImage' -p '*.deb' -p 'latest-linux.yml'
          gh release download "$GITHUB_REF_NAME" -D mobile-artifacts/android -p '*-android*.apk'
          gh release download "$GITHUB_REF_NAME" -D mobile-artifacts/ios -p '*-ios-unsigned.ipa'

      # PREVIEW assets of the new native apps. A failed preview job must not block
      # the legacy release, so these are optional: the notes below list only what
      # was really staged.
      - name: Collect native preview assets
        id: native
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p native-artifacts
          gh release download "$GITHUB_REF_NAME" -D native-artifacts -p 'Tatakai-Next-v*-preview.apk' -p 'Tatakai-Next-v*-preview.zip' || true
          ls -la native-artifacts
          notes=""
          for f in native-artifacts/*-android-preview.apk native-artifacts/*-windows-x64-preview.zip; do
            [ -f "$f" ] || continue
            notes+="- \`$(basename "$f")\`"$'\n'
          done
          {
            echo 'section<<NATIVE_NOTES_EOF'
            if [ -n "$notes" ]; then
              echo '### Preview nativa (M0)'
              echo 'Preview builds of the new native Tatakai apps (milestone M0). They do **not** replace the legacy app: they install and run alongside it and do not share its data.'
              echo
              printf '%s' "$notes"
              echo
              echo '- Android preview: signed with the same developer key as the classic APK, own package `app.tatakai.own.next`.'
              echo '- Windows preview: portable zip; extract anywhere and run `tatakai-next.exe` (see `README-PREVIEW.txt` inside). Unsigned, so SmartScreen may warn.'
              echo '- Features are incomplete; expect rough edges.'
            fi
            echo 'NATIVE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Regenerate the AltStore/SideStore/StikStore source with the real IPA
      # byte size (the committed file ships size 0 as a placeholder). The
      # script auto-detects mobile-artifacts/ios/*.ipa. This copy is attached
      # to the release as a fallback; the canonical hosted source is
      # public/altstore/apps.json served at https://tatakai.me/altstore/apps.json
      # (updated whenever the version bump commit lands + Vercel deploys).
      - name: Setup Node.js (release job)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Regenerate AltStore source with real IPA size
        shell: bash
        run: |
          set -e
          node scripts/generate-altstore-source.mjs --out altstore-apps.json
          node -e "JSON.parse(require('fs').readFileSync('altstore-apps.json','utf8')); console.log('apps.json is valid JSON')"
          ls -la altstore-apps.json mobile-artifacts/ios/

      - name: Upload all artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: altstore-apps.json
          draft: false
          prerelease: false
          append_body: true
          body: |
            ## Downloads

            ### Desktop
            | Platform | Installer | Portable / alt |
            |----------|-----------|----------------|
            | Windows (x64) | `.exe` | `.zip` (portable) |
            | macOS Apple Silicon (M1/M2/M3, arm64) | `Tatakai-*-mac-arm64.dmg` | `Tatakai-*-mac-arm64.zip` |
            | macOS Intel (x64) | `Tatakai-*-mac-x64.dmg` | `Tatakai-*-mac-x64.zip` |
            | Linux (x64) | `.AppImage` | `.deb` |

            > Windows + Linux update automatically via electron-updater.
            > Each device is identified by a unique Client ID (CID) sent with update checks.

            ### macOS — certificate-less manual install
            > Mac builds are ad-hoc signed for bundle integrity, but are not Developer
            > ID signed or notarized. Pick `mac-arm64` for Apple Silicon or `mac-x64`
            > for Intel, drag Tatakai into Applications, and approve the first launch
            > with System Settings → Privacy & Security → Open Anyway.
            > You can alternatively run:
            > ```bash
            > xattr -cr /Applications/Tatakai.app
            > ```
            > macOS updates remain manual: download the latest DMG and replace the app.

            ${{ steps.native.outputs.section }}

            ### Mobile — developer-signed manual install
            - Android: download `Tatakai-*-android.apk` and install it directly. It is
              signed with the developer key, not a Play Store distribution key, so
              Play Protect flags the first install — allow it.
            - iOS: download `Tatakai-*-ios-unsigned.ipa`, then sign and sideload it
              with your own Apple account/tool (AltStore / SideStore / TrollStore).
              iOS cannot install an unsigned IPA directly.
            - Mobile update checks open this release page; the app never self-installs.

            ### Sideload stores & open-source clients
            - iOS (AltStore / SideStore / StikStore): add the official source
              `https://tatakai.me/altstore/apps.json` (Sources tab → + → paste URL),
              or use the `altstore-apps.json` file attached to this release.
              TrollStore users can open the unsigned `.ipa` directly — no Apple ID refresh needed.
            - Android (Obtainium / Droid-ify / Neo Store): track
              `github.com/snozxyx/tatakai` in your client to get update notices for
              the APK above. F-Droid listing is in preparation — note its builds will
              be F-Droid-signed and cannot update over this developer-signed APK.

            ### Web
            - Visit [tatakai.me](https://tatakai.me)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
