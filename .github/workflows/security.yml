name: Security

# Tatakai Next (main): secret scan on every push / PR and a weekly Rust advisory audit.
# Tatakai Classic's npm audit and security regression tests run on the `legacy` branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    uses: ./.github/workflows/runner.yml

  secrets:
    name: Secret scan
    needs: runner
    runs-on: ${{ needs.runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  rust-audit:
    name: Rust advisories (informational)
    needs: runner
    runs-on: ${{ needs.runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit
        working-directory: apps/desktop-native
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit || echo "::warning::cargo audit reported advisories (see the log)"
