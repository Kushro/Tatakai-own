name: Next — release

# A `v<semver>` tag on main builds Tatakai Next for Linux (AppImage), Windows (installer + portable zip) and Android
# (APK signed with the release key) and publishes them as "Tatakai Next <version>", marked latest (the desktop update
# notice reads releases/latest). The tag must match `[workspace.package] version` in apps/desktop-native/Cargo.toml.
# workflow_dispatch builds everything without publishing (artifacts only), to try a change before tagging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Public OAuth client ids (Actions variables, not secrets): AniList allows one redirect URL per client.
  ANILIST_DESKTOP: ${{ vars.ANILIST_CLIENT_ID_DESKTOP }}
  ANILIST_ANDROID: ${{ vars.ANILIST_CLIENT_ID_ANDROID }}

jobs:
  runner:
    uses: ./.github/workflows/runner.yml

  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' apps/desktop-native/Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match apps/desktop-native/Cargo.toml version $cargo_version"
              exit 1
            fi
          else
            version="$cargo_version"
            publish=false
          fi
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not semver: $version"; exit 1; }
          # Android versionCode: MMmmpp (0.1.0 -> 100, 1.2.3 -> 10203)
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Tatakai Next $version (Android versionCode $code), publish=$publish"

  linux:
    name: Linux AppImage
    needs: [runner, meta]
    runs-on: ${{ needs.runner.outputs.linux }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop-native
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file patchelf perl python3 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libmpv-dev libxdo-dev libayatana-appindicator3-dev glib-networking

      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install || rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop-native
          shared-key: next-linux-release

      - name: Build tatakai-next (release)
        env:
          TATAKAI_ANILIST_CLIENT_ID: ${{ env.ANILIST_DESKTOP }}
        run: cargo build --locked --release -p tk-app

      - name: Shaders and fonts (SHA-256 verified)
        run: packaging/linux/fetch-deps.sh

      - name: AppImage
        run: |
          set -euo pipefail
          packaging/linux/build-appimage.sh --bin target/release/tatakai-next
          src=$(ls target/appimage/*.AppImage | head -1)
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv "$src" "$GITHUB_WORKSPACE/out/Tatakai-Next-v${{ needs.meta.outputs.version }}-linux-x86_64.AppImage"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: next-linux
          path: out/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installer + portable
    needs: [runner, meta]
    runs-on: ${{ needs.runner.outputs.windows }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.94.1
        uses: dtolnay/rust-toolchain@ee868d7805ade43a1b47dd054727ab76c9108b4f # 1.94.1
        with:
          toolchain: 1.94.1
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop-native
          shared-key: next-windows-release

      # cl/link/lib/dumpbin on PATH (rquickjs + rusqlite compile C; fetch-deps makes the libmpv import library).
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Runtime deps (libmpv, ffmpeg, Anime4K; SHA-256 pinned)
        run: ./apps/desktop-native/packaging/fetch-deps.ps1 -Only libmpv,ffmpeg,anime4k

      - name: Build tatakai-next (release)
        working-directory: apps/desktop-native
        env:
          TATAKAI_ANILIST_CLIENT_ID: ${{ env.ANILIST_DESKTOP }}
        run: |
          . ./packaging/deps/env.ps1
          if (-not (Test-Path ./packaging/deps/libmpv/mpv.lib)) { throw 'mpv.lib was not generated (dumpbin/lib missing?)' }
          cargo build --release -p tk-app --locked

      - name: Stage the app folder
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "apps/desktop-native"
          $deps = "$app/packaging/deps"
          $stage = Join-Path $PWD "stage/Tatakai-Next"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/shaders", "$stage/assets/fonts" | Out-Null
          Copy-Item "$app/target/release/tatakai-next.exe" $stage
          Copy-Item "$deps/libmpv/libmpv-2.dll" $stage
          Copy-Item "$deps/ffmpeg" "$stage/ffmpeg" -Recurse
          Copy-Item "$deps/shaders/*.glsl" "$stage/shaders"
          Copy-Item "$app/packaging/anime4k.lock.json" "$stage/shaders"
          Copy-Item "$app/crates/tk-ui/assets/fonts/*" "$stage/assets/fonts"
          Copy-Item "$app/LICENSE" $stage
          Copy-Item "$app/THIRD_PARTY_NOTICES.md" $stage

      # --version exits before any window, data dir or single-instance lock exists.
      - name: Smoke check
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'stage/Tatakai-Next'
          foreach ($f in 'tatakai-next.exe', 'libmpv-2.dll', 'ffmpeg/bin/ffmpeg.exe', 'shaders/Anime4K_Restore_CNN_M.glsl', 'LICENSE') {
            if (-not (Test-Path (Join-Path $root $f))) { throw "package is missing $f" }
          }
          $out = Join-Path $env:RUNNER_TEMP 'tk-version.txt'
          $p = Start-Process -FilePath (Join-Path $root 'tatakai-next.exe') -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $text = Get-Content $out -Raw
          Write-Host "exit=$($p.ExitCode) output=$text"
          if ($p.ExitCode -ne 0 -or $text -notmatch '^tatakai-next ${{ needs.meta.outputs.version }}') { throw '--version smoke check failed' }

      - name: Portable zip
        run: |
          $v = '${{ needs.meta.outputs.version }}'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path stage/Tatakai-Next -DestinationPath "out/Tatakai-Next-v$v-windows-x64-portable.zip" -CompressionLevel Optimal

      # NSIS ships on GitHub's Windows images; other images get it from Chocolatey. The script is the dx template
      # (packaging/windows.nsi): its {{...}} values are filled here. No WebView2 bootstrapper is bundled (nothing
      # unpinned goes into the installer): without WebView2 the installer explains it and stops.
      - name: Installer (NSIS)
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ needs.meta.outputs.version }}'
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe' }
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress; $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe' }
          $out = Join-Path $PWD "out/Tatakai-Next-v$v-windows-x64-setup.exe"
          $license = (Resolve-Path apps/desktop-native/LICENSE).Path
          $nsi = Get-Content apps/desktop-native/packaging/windows.nsi -Raw
          $nsi = $nsi.Replace('{{output_path}}', $out).Replace('{{license}}', $license).Replace('{{version}}', $v).Replace('{{webview_install_code}}', 'StrCpy $0 1')
          $rendered = Join-Path $env:RUNNER_TEMP 'tatakai-next.nsi'
          Set-Content -Path $rendered -Value $nsi -Encoding utf8
          $winver = ($v -replace '-.*$', '') + '.0'
          & $makensis /V2 "/DPAYLOAD=$((Resolve-Path stage/Tatakai-Next).Path)" "/DWINDOWS_VERSION=$winver" $rendered
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: next-windows
          path: out/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK (release key)
    needs: [runner, meta]
    runs-on: ${{ needs.runner.outputs.linux }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Platform + build tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "platforms;android-37.0" || sdkmanager "platforms;android-37"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-next-${{ runner.os }}-${{ hashFiles('apps/android-native/**/*.gradle.kts', 'apps/android-native/gradle/**') }}
          restore-keys: gradle-next-${{ runner.os }}-

      # KKUP/tatakai.keystore (alias `tatakai`) from repo secrets, read by app/build.gradle.kts through TATAKAI_SIGNING.
      - name: Release key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is missing: refusing to build an APK with a throwaway key"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tatakai.keystore"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/tatakai.keystore"
            printf 'storeType=PKCS12\n'
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > "$RUNNER_TEMP/tatakai.keystore.properties"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > apps/android-native/local.properties

      - name: Assemble release
        working-directory: apps/android-native
        env:
          TATAKAI_SIGNING: ${{ runner.temp }}/tatakai.keystore.properties
          TATAKAI_ANILIST_CLIENT_ID: ${{ env.ANILIST_ANDROID }}
          TATAKAI_VERSION_NAME: ${{ needs.meta.outputs.version }}
          TATAKAI_VERSION_CODE: ${{ needs.meta.outputs.code }}
          TATAKAI_ABI_SPLITS: 'true'
        run: bash gradlew :app:assembleRelease --no-daemon --stacktrace

      # Every published APK must carry the release certificate (SHA-256 42:B7:74:11:...:20:5A), never a debug key.
      # app-<abi>-release.apk -> Tatakai-Next-v<version>-android-<abi>.apk (universal included).
      - name: Verify signatures and name the APKs
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir -p out
          n=0
          for src in apps/android-native/app/build/outputs/apk/release/app-*-release.apk; do
            digest=$("$apksigner" verify --print-certs "$src" | grep -m1 'certificate SHA-256 digest' | sed 's/.*: //')
            echo "$(basename "$src"): $digest"
            if [ "$digest" != "42b7741136036ba74f40f6c21fb4b92b802e5ef261bcb99f3a90c6d63421205a" ]; then
              echo "::error::$(basename "$src") is not signed with the Tatakai release key"
              exit 1
            fi
            abi=$(basename "$src" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$src" "out/Tatakai-Next-v${{ needs.meta.outputs.version }}-android-$abi.apk"
            n=$((n + 1))
          done
          [ "$n" -ge 4 ] || { echo "::error::expected 3 ABI APKs + universal, got $n"; exit 1; }
          rm -f "$RUNNER_TEMP/tatakai.keystore" "$RUNNER_TEMP/tatakai.keystore.properties"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: next-android
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: [runner, meta, linux, windows, android]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ${{ needs.runner.outputs.linux }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        run: |
          set -euo pipefail
          v='${{ needs.meta.outputs.version }}'
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Notes: the CHANGELOG.md section of this version, if any
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md 2>/dev/null || true
          {
            echo
            echo '| Platform | Download |'
            echo '|---|---|'
            echo "| Windows x64 | \`Tatakai-Next-v$v-windows-x64-setup.exe\` (installer) or \`…-portable.zip\` |"
            echo "| Linux x86_64 | \`Tatakai-Next-v$v-linux-x86_64.AppImage\` |"
            echo "| Android | \`Tatakai-Next-v$v-android-arm64-v8a.apk\` (almost every phone), \`…-armeabi-v7a.apk\` (old 32-bit phones), \`…-x86_64.apk\` (emulators, Chromebooks) or \`…-universal.apk\` (any, bigger). Signed with the Tatakai release key. |"
            echo
            echo 'Windows builds are not code-signed: SmartScreen may warn on first run. Tatakai Classic is published from the `legacy` branch (`legacy-v*` tags).'
          } >> notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v='${{ needs.meta.outputs.version }}'
          # 1.2.3-beta.1 is a pre-release (never "latest"); a plain version becomes latest
          if [[ "$v" == *-* ]]; then kind=(--prerelease --latest=false); else kind=(--latest); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tatakai Next $v" --notes-file notes.md "${kind[@]}"
