name: Desktop native (Linux)

# Linux is a primary target of apps/desktop-native (docs/redesign/09 section 0). This workflow runs the
# workspace tests, builds the release binary against the system libmpv / WebKitGTK and packs the AppImage.
# On manual runs it can also build the Arch package from the PKGBUILD in an Arch container.

on:
  push:
    branches:
      - 'main'
      - 'redesign/**'
      - 'm3e/**'
    paths:
      - 'apps/desktop-native/**'
      - 'resources/icon-*.png'
      - '.github/workflows/desktop-native-linux.yml'
  pull_request:
    paths:
      - 'apps/desktop-native/**'
      - 'resources/icon-*.png'
      - '.github/workflows/desktop-native-linux.yml'
  workflow_dispatch:
    inputs:
      pkgbuild:
        description: 'Also build the Arch package (archlinux container)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-native-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Test, build and AppImage (Ubuntu 24.04)
    # 24.04 ships mpv 0.37 (libmpv client API 2.x, required by libmpv2 4) and webkit2gtk-4.1.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop-native

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file patchelf perl python3 xvfb \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libmpv-dev libxdo-dev libayatana-appindicator3-dev glib-networking \
            desktop-file-utils appstream

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml pins the channel: rustup >= 1.28 installs it with a bare `toolchain install`,
        # older rustup with `show`.
        run: rustup toolchain install || rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop-native/target
          key: desktop-native-linux-${{ runner.os }}-${{ hashFiles('apps/desktop-native/Cargo.lock', 'apps/desktop-native/rust-toolchain.toml') }}
          restore-keys: |
            desktop-native-linux-${{ runner.os }}-

      - name: Check packaging files
        run: |
          for f in packaging/linux/*.sh packaging/linux/AppRun packaging/linux/PKGBUILD; do bash -n "$f"; done
          desktop-file-validate packaging/linux/app.tatakai.own.next.desktop
          appstreamcli validate --no-net packaging/linux/app.tatakai.own.next.metainfo.xml

      - name: Test workspace (no libmpv, no live backend)
        run: xvfb-run -a cargo test --locked --workspace --no-default-features

      - name: Build tatakai-next (release, mpv + live)
        run: cargo build --locked --release -p tk-app

      - name: Fetch shaders and fonts (SHA-256 verified)
        run: packaging/linux/fetch-deps.sh

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh --bin target/release/tatakai-next

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: tatakai-next-linux-x86_64-appimage
          path: apps/desktop-native/target/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  arch-package:
    name: Arch package (PKGBUILD)
    if: github.event_name == 'workflow_dispatch' && inputs.pkgbuild
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm --needed git rustup

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with makepkg
        # makepkg refuses to run as root.
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          su builder -c 'rustup default stable'
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE'"
          cd "$GITHUB_WORKSPACE/apps/desktop-native/packaging/linux"
          su builder -c 'makepkg --syncdeps --noconfirm --nocheck'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tatakai-next-arch-package
          path: apps/desktop-native/packaging/linux/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
